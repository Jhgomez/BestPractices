syntax = "proto3";

import "Token.proto";
import "GuestSession.proto";

option java_package = "com.demo.core.datastore.proto";
option java_multiple_files = true;

/**
 * check here https://protobuf.dev/programming-guides/proto3/#location to know
 * how to organize your messages. You could add directories representing packages
 * inside the proto directory if you want to express your app's package
 */
message Auth {
  Token requestToken = 1;
  /**
   * Session id of existing users(we're not given an expiration time as opposed to guest sessions).
   * This never expires, can't be fetched again after generated, and there is no limit for sessions
   * created as stated here https://www.themoviedb.org/talk/5caf6d169251412fa022562a
   */
  string session = 2;
  GuestSession guestSession = 3; // very specific type of session
}

